spring.application.name=AlertaLote

# --- Base de datos ---
# Las credenciales NO van aquí. Se leen de variables de entorno (DB_URL, DB_USER, DB_PASSWORD)
# o del archivo application-local.properties, que está en .gitignore.
spring.config.import=optional:classpath:application-local.properties
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/alerta_lote_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# --- Alertas ---
# Días de anticipación para avisar que un lote está por vencer
alertas.dias-anticipacion=7
# Revisión automática todos los días a las 6:00 a. m. (hora de Colombia)
alertas.cron=0 0 6 * * *
alertas.zona-horaria=America/Bogota
